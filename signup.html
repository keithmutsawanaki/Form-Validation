<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="signup-body">
    <div class="page-shell">
      <div class="signup-card">
        <aside class="visual-panel">
          <div class="visual-bg"></div>
          <div class="promo-copy">
            <h2>Create your<br />Account</h2>
            <p>Share your artwork<br />and Get projects!</p>
          </div>
        </aside>

        <main class="form-panel">
          <h1>Sign Up</h1>

          <form class="signup-form" action="#" novalidate>
            <input type="text" placeholder="First name" aria-label="First name" />
            <input type="text" placeholder="Last name" aria-label="Last name" />
            <input type="email" placeholder="Email address" aria-label="Email address" />
            <input type="password" placeholder="Password" aria-label="Password" />

            <label class="terms">
              <input type="checkbox" />
              <span>Accept Terms &amp; Conditions</span>
            </label>

            <button type="submit" class="submit-btn">
              Join us <span aria-hidden="true">→</span>
            </button>

            <div class="divider"><span>or</span></div>

            <button type="button" class="social-btn google-btn">
              <span class="icon">G</span>
              <span>Sign up with Google</span>
            </button>

            <button type="button" class="social-btn apple-btn">
              <span class="icon"></span>
              <span>Sign up with Apple</span>
            </button>
          </form>
        </main>
      </div>
    </div>
  </body>
</html>
